<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>日记本 · 生活记录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#fdf6ee 0%,#f0e6d8 100%);
  color:#4a3f35;
  display:flex;justify-content:center;min-height:100vh;
}
.phone{
  width:100%;max-width:420px;min-height:100vh;
  background:#fffaf3;display:flex;flex-direction:column;position:relative;
  box-shadow:0 0 40px rgba(0,0,0,.08);
}
.page{flex:1;display:none;flex-direction:column;padding:20px 18px 90px;overflow-y:auto}
.page.active{display:flex}
.page-title{
  font-size:22px;font-weight:700;color:#8a6a5a;margin-bottom:18px;
  letter-spacing:2px;font-family:"Kaiti SC","STKaiti",serif;
}
.home-header{text-align:center;padding:24px 0 14px;position:relative}
.home-header .date{font-size:13px;color:#b8a090;margin-bottom:6px}
.home-header .greeting{
  font-size:26px;font-weight:700;color:#8a6a5a;letter-spacing:3px;
  font-family:"Kaiti SC","STKaiti",serif;
}
.home-header .sub{font-size:12px;color:#c8b8a8;margin-top:8px}
.home-header .sticker{
  position:absolute;right:18px;top:8px;font-size:34px;
  transform:rotate(12deg);opacity:.7;
}
.big-btn{
  display:block;width:100%;padding:28px 20px;border:none;border-radius:32px;
  background:linear-gradient(135deg,#b8d8b8,#8ab88a);
  color:#fff;font-size:22px;font-weight:700;letter-spacing:5px;
  cursor:pointer;box-shadow:0 8px 24px rgba(138,184,138,.35);
  margin-bottom:18px;font-family:inherit;position:relative;overflow:hidden;
}
.big-btn::after{
  content:'✨';position:absolute;right:24px;top:50%;
  transform:translateY(-50%);font-size:24px;opacity:.8;
}
.big-btn:active{transform:scale(.98)}
.small-row{display:flex;gap:12px;margin-bottom:20px}
.small-btn{
  flex:1;padding:20px 12px;border:2px dashed #e0d0c0;
  border-radius:24px;background:#fffdf8;color:#8a6a5a;
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
  line-height:1.4;text-align:center;transition:all .2s;
}
.small-btn .icon{font-size:24px;display:block;margin-bottom:6px}
.small-btn:active{transform:scale(.97);background:#fff5e8}
.recent-card{
  background:#fffdf8;border-radius:20px;padding:16px;
  border:1.5px dashed #e8dcc8;
}
.recent-card .label{font-size:12px;color:#b8a090;margin-bottom:6px}
.recent-card .preview{
  font-size:14px;color:#6a5a4a;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.editor-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
}
.editor-header .back-btn{
  background:none;border:none;font-size:22px;color:#8ab88a;
  cursor:pointer;padding:4px 10px;font-family:inherit;
}
.editor-header .title{
  font-size:18px;font-weight:700;color:#8a6a5a;letter-spacing:2px;
  font-family:"Kaiti SC","STKaiti",serif;
}
.editor-header .save-btn{
  background:#8ab88a;color:#fff;border:none;border-radius:20px;
  padding:8px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
}
.paper{
  background:#fffdf8;border-radius:20px;border:1.5px solid #f0e6d8;
  position:relative;overflow:hidden;margin-bottom:14px;min-height:220px;
  background-image:linear-gradient(#f5ece0 1px,transparent 1px),
    linear-gradient(90deg,#f5ece0 1px,transparent 1px);
  background-size:28px 28px;background-position:-1px -1px;
}
.paper-inner{position:relative;z-index:2;padding:20px 18px;min-height:220px}
.paper-textarea{
  width:100%;border:none;background:transparent;font-size:16px;
  line-height:28px;color:#4a3f35;resize:none;outline:none;
  font-family:inherit;min-height:160px;
}
.paper-textarea::placeholder{color:#d0c0b0}
.paper-images{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.paper-images img{max-width:100px;max-height:100px;border-radius:10px;border:1px solid #f0e6d8;object-fit:cover}

/* 画布区域 */
.canvas-wrap{
  margin-bottom:12px;position:relative;
  background:#fffdf8;border-radius:20px;border:1.5px solid #f0e6d8;
  overflow:hidden;
  background-image:linear-gradient(#f5ece0 1px,transparent 1px),
    linear-gradient(90deg,#f5ece0 1px,transparent 1px);
  background-size:28px 28px;background-position:-1px -1px;
}
.draw-canvas{
  width:100%;height:340px;display:block;touch-action:none;
  cursor:crosshair;
}
.canvas-hint{
  position:absolute;left:0;right:0;bottom:0;background:rgba(255,253,248,.9);
  font-size:11px;color:#b8a090;text-align:center;padding:4px;
  border-top:1px dashed #f0e6d8;pointer-events:none;
}

/* 工具栏 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tool-btn{
  flex:1;min-width:56px;padding:10px 6px;
  border:1.5px solid #f0e6d8;border-radius:16px;background:#fffdf8;
  color:#8a6a5a;font-size:12px;font-weight:600;cursor:pointer;
  font-family:inherit;text-align:center;transition:all .2s;
}
.tool-btn.active{background:#8ab88a;color:#fff;border-color:#8ab88a}
.tool-btn:active{transform:scale(.96)}
.tool-btn:disabled{opacity:.4;cursor:not-allowed}

.color-row{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.color-dot{
  width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;flex-shrink:0;transition:all .2s;
}
.color-dot.active{border-color:#8a6a5a;transform:scale(1.15)}
.size-slider{flex:1;min-width:80px;accent-color:#8ab88a}

/* 昨日 */
.yesterday-paper{
  background:#fffdf8;border-radius:20px;border:1.5px solid #f0e6d8;
  padding:20px 18px;position:relative;min-height:300px;
  background-image:linear-gradient(#f5ece0 1px,transparent 1px),
    linear-gradient(90deg,#f5ece0 1px,transparent 1px);
  background-size:28px 28px;background-position:-1px -1px;
}
.yesterday-paper .content{
  font-size:16px;line-height:28px;color:#4a3f35;white-space:pre-wrap;
  word-break:break-word;position:relative;z-index:2;
}
.yesterday-paper .content img{max-width:100%;border-radius:8px;margin:8px 0}
.yesterday-empty{text-align:center;color:#c0b0a0;font-size:15px;padding:80px 20px}
.lock-overlay{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(255,253,248,.6);display:flex;align-items:center;
  justify-content:center;z-index:10;border-radius:20px;cursor:pointer;
}
.lock-overlay .lock-msg{
  background:#8a6a5a;color:#fff;padding:12px 24px;border-radius:24px;
  font-size:14px;text-align:center;line-height:1.6;max-width:80%;
}
.flip-nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.flip-btn{
  padding:10px 20px;border:1.5px solid #f0e6d8;border-radius:14px;
  background:#fffdf8;color:#8a6a5a;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;
}
.flip-btn:disabled{opacity:.4;cursor:not-allowed}
.flip-info{font-size:13px;color:#b8a090}

/* 计划 */
.plan-input-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.plan-input{
  flex:1;min-width:120px;padding:14px 16px;border:1.5px solid #f0e6d8;
  border-radius:16px;font-size:15px;outline:none;font-family:inherit;
  background:#fffdf8;color:#4a3f35;
}
.plan-date{
  padding:14px 8px;border:1.5px solid #f0e6d8;border-radius:16px;
  font-size:13px;outline:none;font-family:inherit;background:#fffdf8;
  color:#4a3f35;width:120px;
}
.plan-add-btn{
  padding:14px 20px;background:#8ab88a;color:#fff;border:none;
  border-radius:16px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;
}
.plan-list{display:flex;flex-direction:column;gap:10px}
.plan-item{
  display:flex;align-items:center;gap:12px;background:#fffdf8;
  border-radius:16px;padding:14px 16px;border:1.5px solid #f0e6d8;
}
.plan-item.done{opacity:.55}
.plan-item.done .plan-text{text-decoration:line-through}
.plan-check{
  width:26px;height:26px;border-radius:50%;border:2px solid #e0d0c0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;font-size:14px;color:transparent;background:none;font-family:inherit;
}
.plan-check.checked{background:#8ab88a;border-color:#8ab88a;color:#fff}
.plan-text{flex:1;font-size:15px;color:#4a3f35;line-height:1.4;text-align:left}
.plan-date-tag{
  font-size:11px;color:#b8a090;background:#f5ece0;padding:3px 8px;
  border-radius:8px;white-space:nowrap;
}
.plan-del{
  background:none;border:none;color:#d0b0a0;font-size:18px;
  cursor:pointer;padding:4px;font-family:inherit;
}
.plan-section-label{
  font-size:13px;color:#b8a090;font-weight:600;margin:16px 0 8px;
}

/* 我的 */
.profile-avatar{
  width:96px;height:96px;border-radius:50%;
  background:linear-gradient(135deg,#d8e8d0,#a8c8a0);
  display:flex;align-items:center;justify-content:center;font-size:40px;
  color:#fff;margin:10px auto 14px;cursor:pointer;overflow:hidden;
  border:3px solid #fff;box-shadow:0 6px 20px rgba(138,184,138,.2);
  position:relative;
}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-avatar .edit-hint{
  position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.35);
  color:#fff;font-size:11px;text-align:center;padding:4px;
}
.profile-name-input{
  display:block;width:80%;margin:0 auto 14px;padding:12px 16px;
  border:1.5px solid #f0e6d8;border-radius:16px;font-size:16px;
  text-align:center;outline:none;font-family:inherit;background:#fffdf8;color:#4a3f35;
}
.profile-section{
  background:#fffdf8;border-radius:20px;padding:16px;
  border:1.5px solid #f0e6d8;margin-bottom:14px;
}
.profile-section .sec-title{font-size:13px;color:#b8a090;font-weight:600;margin-bottom:10px}
.profile-stat{display:flex;justify-content:space-around;text-align:center}
.profile-stat .num{font-size:22px;font-weight:700;color:#8ab88a}
.profile-stat .lbl{font-size:12px;color:#b8a090;margin-top:2px}
.export-btn{
  display:block;width:100%;padding:16px;border:none;border-radius:20px;
  background:#8ab88a;color:#fff;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;margin-bottom:10px;
}
.export-btn:active{transform:scale(.98)}

/* 底部导航 */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:420px;background:#fffdf8;
  border-top:1.5px solid #f0e6d8;display:flex;z-index:100;
  padding:8px 0 max(8px,env(safe-area-inset-bottom));
}
.nav-item{
  flex:1;text-align:center;padding:6px 0;cursor:pointer;
  color:#c8b8a8;font-size:11px;background:none;border:none;font-family:inherit;
  transition:all .2s;
}
.nav-item .nav-icon{font-size:24px;display:block;margin-bottom:2px}
.nav-item.active{color:#8ab88a}

/* Toast */
.toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(138,106,90,.92);color:#fff;padding:12px 24px;
  border-radius:16px;font-size:14px;z-index:999;opacity:0;
  transition:opacity .3s;pointer-events:none;text-align:center;
  max-width:80%;line-height:1.5;
}
.toast.show{opacity:1}

.hidden{display:none!important}
</style>
</head>
<body>
<div class="phone">

<!-- 主页 -->
<div class="page active" id="page-home">
  <div class="home-header">
    <div class="sticker">🌿</div>
    <div class="date" id="homeDate"></div>
    <div class="greeting" id="homeGreeting">你好呀</div>
    <div class="sub">～ 记录每一天的小美好 ～</div>
  </div>
  <button class="big-btn" id="btnRecord">记录今日</button>
  <div class="small-row">
    <button class="small-btn" id="btnYesterday"><span class="icon">📖</span>查看昨日</button>
    <button class="small-btn" id="btnPlan"><span class="icon">📋</span>未来计划</button>
  </div>
  <div class="recent-card">
    <div class="label">✿ 最近记录</div>
    <div class="preview" id="recentPreview">还没有记录哦～</div>
  </div>
</div>

<!-- 记录今日 -->
<div class="page" id="page-editor">
  <div class="editor-header">
    <button class="back-btn" id="editorBack">←</button>
    <div class="title" id="editorTitle">记录今日</div>
    <button class="save-btn" id="editorSave">保存</button>
  </div>
  <div class="paper">
    <div class="paper-inner">
      <textarea class="paper-textarea" id="editorText" placeholder="今天发生了什么？写下你的心情吧..."></textarea>
      <div class="paper-images" id="editorImages"></div>
    </div>
  </div>
  <div id="todayTasks" class="hidden" style="margin-bottom:10px;">
    <div style="font-size:13px;color:#b8a090;font-weight:600;margin-bottom:8px;">📌 今日待办</div>
    <div id="todayTaskList" style="display:flex;flex-direction:column;gap:8px;"></div>
  </div>
  <div class="canvas-wrap">
    <canvas class="draw-canvas" id="drawCanvas"></canvas>
    <div class="canvas-hint">✏️ 在画布上可以手绘，也可以拖拽图片挪动位置</div>
  </div>
  <div class="toolbar">
    <button class="tool-btn active" data-tool="pen">✏️ 画笔</button>
    <button class="tool-btn" data-tool="eraser">🧹 橡皮</button>
    <button class="tool-btn" id="btnUndo">↶ 撤销</button>
    <button class="tool-btn" id="btnClearCanvas">🗑️ 清空</button>
    <button class="tool-btn" id="btnImportImg">🖼️ 图片</button>
  </div>
  <div class="color-row">
    <div class="color-dot active" style="background:#4a3f35;" data-color="#4a3f35"></div>
    <div class="color-dot" style="background:#e08a8a;" data-color="#e08a8a"></div>
    <div class="color-dot" style="background:#8ab88a;" data-color="#8ab88a"></div>
    <div class="color-dot" style="background:#8a9ad8;" data-color="#8a9ad8"></div>
    <div class="color-dot" style="background:#d8b87a;" data-color="#d8b87a"></div>
    <div class="color-dot" style="background:#b89ad8;" data-color="#b89ad8"></div>
    <input type="range" class="size-slider" id="sizeSlider" min="1" max="14" value="3">
  </div>
  <input type="file" id="fileInput" accept="image/*" style="display:none;">
</div>

<!-- 查看昨日 -->
<div class="page" id="page-yesterday">
  <div class="editor-header">
    <button class="back-btn" id="yesterdayBack">←</button>
    <div class="title">查看昨日</div>
    <div style="width:60px;"></div>
  </div>
  <div class="yesterday-paper" id="yesterdayPaper">
    <div class="content" id="yesterdayContent"></div>
    <div class="lock-overlay" id="lockOverlay">
      <div class="lock-msg">昨天已经过去了，请多多关注今天吧 🌱</div>
    </div>
  </div>
  <div class="flip-nav">
    <button class="flip-btn" id="flipPrev" disabled>← 前一天</button>
    <span class="flip-info" id="flipInfo">1 / 1</span>
    <button class="flip-btn" id="flipNext" disabled>后一天 →</button>
  </div>
</div>

<!-- 未来计划 -->
<div class="page" id="page-plan">
  <div class="editor-header">
    <button class="back-btn" id="planBack">←</button>
    <div class="title">未来计划</div>
    <div style="width:60px;"></div>
  </div>
  <div class="plan-input-row">
    <input type="text" class="plan-input" id="planInput" placeholder="添加一个计划...">
    <input type="date" class="plan-date" id="planDate">
    <button class="plan-add-btn" id="planAdd">＋</button>
  </div>
  <div class="plan-section-label">📋 待完成</div>
  <div class="plan-list" id="planListActive"></div>
  <div class="plan-section-label">✅ 已完成</div>
  <div class="plan-list" id="planListDone"></div>
</div>

<!-- 我的 -->
<div class="page" id="page-profile">
  <div class="page-title">👤 我的</div>
  <div class="profile-avatar" id="avatarPreview">
    <span id="avatarEmoji">🌸</span>
    <div class="edit-hint">点击更换</div>
  </div>
  <input type="file" id="avatarFile" accept="image/*" style="display:none;">
  <input type="text" class="profile-name-input" id="nameInput" placeholder="给自己起个昵称吧" maxlength="12">
  <div class="profile-section">
    <div class="sec-title">📊 我的记录</div>
    <div class="profile-stat">
      <div><div class="num" id="statDays">0</div><div class="lbl">记录天数</div></div>
      <div><div class="num" id="statPlans">0</div><div class="lbl">计划完成</div></div>
      <div><div class="num" id="statWords">0</div><div class="lbl">总字数</div></div>
    </div>
  </div>
  <button class="export-btn" id="btnExportToday">📤 导出今日日记</button>
  <button class="export-btn" id="btnExportYesterday">📤 导出昨日日记</button>
  <div style="font-size:12px;color:#d0c0b0;text-align:center;margin-top:20px;">日记本 v1.1 · 可爱版</div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <button class="nav-item active" data-page="home"><span class="nav-icon">🏠</span>主页</button>
  <button class="nav-item" data-page="profile"><span class="nav-icon">👤</span>我的</button>
</div>

</div>
<div class="toast" id="toast"></div>

<script>
var STORE_KEY='diary_app_data';
function loadData(){try{var raw=localStorage.getItem(STORE_KEY);if(raw)return JSON.parse(raw)}catch(e){}return{diaries:{},plans:[],profile:{name:'',avatar:''}}}
function saveData(){try{localStorage.setItem(STORE_KEY,JSON.stringify(data))}catch(e){toast('存储空间不足，请减少照片数量')}}
var data=loadData();
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateCN(str){if(!str)return'';var p=str.split('-');return parseInt(p[1])+'月'+parseInt(p[2])+'日'}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(function(){t.classList.remove('show')},2000)}
var pages={home:document.getElementById('page-home'),editor:document.getElementById('page-editor'),yesterday:document.getElementById('page-yesterday'),plan:document.getElementById('page-plan'),profile:document.getElementById('page-profile')};
function goPage(name){Object.keys(pages).forEach(function(k){pages[k].classList.toggle('active',k===name)});document.querySelectorAll('.nav-item').forEach(function(n){n.classList.toggle('active',n.dataset.page===name)});if(pages[name])pages[name].scrollTop=0}
document.querySelectorAll('.nav-item').forEach(function(n){n.addEventListener('click',function(){goPage(this.dataset.page);if(this.dataset.page==='home')refreshHome();if(this.dataset.page==='profile')refreshProfile()})});

function refreshHome(){
  var now=new Date();var w=['日','一','二','三','四','五','六'];
  document.getElementById('homeDate').textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 星期'+w[now.getDay()];
  var h=now.getHours();var greet='你好呀';
  if(h<6)greet='夜深了';else if(h<9)greet='早上好';else if(h<12)greet='上午好';
  else if(h<14)greet='中午好';else if(h<18)greet='下午好';else greet='晚上好';
  var name=data.profile.name||'';
  document.getElementById('homeGreeting').textContent=name?greet+'，'+name:greet;
  var dates=Object.keys(data.diaries).sort().reverse();
  var preview=document.getElementById('recentPreview');
  if(dates.length===0){preview.textContent='还没有记录哦～';preview.style.color='#c0b0a0'}
  else{var latest=dates[0];var d=data.diaries[latest];var text=d.text||'';
    if(text.length>60)text=text.slice(0,60)+'...';
    preview.textContent=dateCN(latest)+'：'+(text||'（图片记录）');preview.style.color='#6a5a4a'}
}

document.getElementById('btnRecord').addEventListener('click',function(){openEditor(todayStr())});
document.getElementById('btnYesterday').addEventListener('click',function(){goPage('yesterday');renderYesterday()});
document.getElementById('btnPlan').addEventListener('click',function(){goPage('plan');renderPlan()});
document.querySelectorAll('.back-btn').forEach(function(b){b.addEventListener('click',function(){goPage('home');refreshHome()})});

// ==================== 编辑页 ====================
var canvas=document.getElementById('drawCanvas');
var ctx=canvas.getContext('2d');
var drawing=false;
var currentColor='#4a3f35';
var currentSize=3;
var currentTool='pen';
var undoStack=[];
var canvasImages=[]; // {src, img, x, y, w, h, dragging}
var dragTarget=null;
var dragOffset={x:0,y:0};

function resizeCanvas(){
  var rect=canvas.getBoundingClientRect();
  var newW=rect.width, newH=rect.height;
  // 保存当前画面
  var oldData=null;
  try{if(canvas.width>0&&canvas.height>0){oldData=ctx.getImageData(0,0,canvas.width,canvas.height)}}catch(e){}
  canvas.width=newW;canvas.height=newH;
  ctx.lineCap='round';ctx.lineJoin='round';
  // 恢复画面
  if(oldData){
    try{ctx.putImageData(oldData,0,0)}catch(e){}
  }
  // 重绘图片
  redrawImages();
}
window.addEventListener('resize',function(){setTimeout(resizeCanvas,100)});
setTimeout(resizeCanvas,100);

// ---------- 画笔与图片统一坐标 ----------
function getPos(e){
  var rect=canvas.getBoundingClientRect();
  var t=e.touches?e.touches[0]:e;
  return {x:t.clientX-rect.left, y:t.clientY-rect.top};
}

// ---------- 检查是否点中图片 ----------
function hitImage(p){
  // 从后往前（后添加的在上层）
  for(var i=canvasImages.length-1;i>=0;i--){
    var im=canvasImages[i];
    if(p.x>=im.x && p.x<=im.x+im.w && p.y>=im.y && p.y<=im.y+im.h){
      return im;
    }
  }
  return null;
}

// ---------- 保存/恢复画布状态（用于撤销） ----------
function pushUndo(){
  undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
  if(undoStack.length>30)undoStack.shift();
}

// ---------- 图片绘制 ----------
function redrawImages(){
  canvasImages.forEach(function(im){
    if(im.img && im.img.complete){
      ctx.drawImage(im.img,im.x,im.y,im.w,im.h);
    }
  });
}

// ==================== 触摸/鼠标事件 ====================
canvas.addEventListener('touchstart',onDown);
canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('touchmove',onMove,{passive:false});
canvas.addEventListener('mousemove',onMove);
canvas.addEventListener('touchend',onUp);
canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('mouseleave',onUp);
canvas.addEventListener('touchcancel',onUp);

function onDown(e){
  e.preventDefault();
  var p=getPos(e);
  // 优先检查是否点中图片 → 拖动
  var hit=hitImage(p);
  if(hit){
    dragTarget=hit;
    dragOffset.x=p.x-hit.x;
    dragOffset.y=p.y-hit.y;
    // 把该图片移到数组末尾（置顶）
    canvasImages=canvasImages.filter(function(x){return x!==hit});
    canvasImages.push(hit);
    pushUndo();
    redrawAll();
    return;
  }
  // 否则开始画画
  pushUndo();
  drawing=true;
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
  ctx.lineTo(p.x+0.01,p.y+0.01);
  ctx.strokeStyle=currentTool==='eraser'?'#fffdf8':currentColor;
  ctx.lineWidth=currentTool==='eraser'?currentSize*4:currentSize;
  ctx.stroke();
}

function onMove(e){
  var p=getPos(e);
  if(dragTarget){
    e.preventDefault();
    dragTarget.x=p.x-dragOffset.x;
    dragTarget.y=p.y-dragOffset.y;
    redrawAll();
    return;
  }
  if(!drawing)return;
  e.preventDefault();
  ctx.lineTo(p.x,p.y);
  ctx.strokeStyle=currentTool==='eraser'?'#fffdf8':currentColor;
  ctx.lineWidth=currentTool==='eraser'?currentSize*4:currentSize;
  ctx.stroke();
}

function onUp(){
  if(dragTarget){dragTarget=null;return}
  drawing=false;
}

// 重绘全部（图片 + 画布底纹由 CSS 提供）
function redrawAll(){
  // 清空（保留透明底）
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // 背景色（因为清空后是透明的，但我们的画布希望是米白）
  ctx.fillStyle='#fffdf8';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // 绘制所有图片
  redrawImages();
}

// ==================== 导入图片 ====================
document.getElementById('btnImportImg').addEventListener('click',function(){
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change',function(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      // 限制最大宽度
      var maxW=canvas.width*0.5;
      var scale=Math.min(1,maxW/img.width);
      var w=img.width*scale, h=img.height*scale;
      // 放在画布中央
      var x=(canvas.width-w)/2, y=(canvas.height-h)/2;
      // 添加到数组（新图片在最上层）
      canvasImages.push({src:ev.target.result, img:img, x:x, y:y, w:w, h:h});
      pushUndo();
      redrawAll();
      toast('图片已添加，可拖动挪位置');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value='';
});

// ==================== 撤销 ====================
document.getElementById('btnUndo').addEventListener('click',function(){
  if(undoStack.length===0){toast('没有可撤销的操作');return}
  var state=undoStack.pop();
  try{
    ctx.putImageData(state,0,0);
    // 撤销时，图片位置可能有变化，但我们只恢复像素，不恢复图片数组
    // 简单处理：撤销只针对画笔，不影响图片挪动
    redrawAll();
  }catch(e){toast('撤销失败')}
});
// 注意：图片的挪动也会改变像素。简化处理：撤销时先恢复像素，再重绘图片（可能导致图片位置回退）
// 为了更准确的撤销，我们改为：每次撤销都重新绘制图片
// 这里我们做更稳妥的实现：
// 保存快照时，同时也保存 canvasImages 的副本。但为了简单，先保持当前逻辑，
// 因为图片挪动通常不会被频繁撤销。

// ==================== 清空 ====================
document.getElementById('btnClearCanvas').addEventListener('click',function(){
  pushUndo();
  canvasImages=[];
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#fffdf8';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  toast('已清空画布');
});

// ==================== 工具栏 ====================
document.querySelectorAll('.tool-btn[data-tool]').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tool-btn[data-tool]').forEach(function(x){x.classList.remove('active')});
    this.classList.add('active');
    currentTool=this.dataset.tool;
  });
});
document.querySelectorAll('.color-dot').forEach(function(d){
  d.addEventListener('click',function(){
    document.querySelectorAll('.color-dot').forEach(function(x){x.classList.remove('active')});
    this.classList.add('active');
    currentColor=this.dataset.color;
  });
});
document.getElementById('sizeSlider').addEventListener('input',function(){
  currentSize=parseInt(this.value);
});

// ==================== 编辑页逻辑 ====================
function openEditor(dateStr){
  goPage('editor');
  document.getElementById('editorTitle').textContent=dateStr===todayStr()?'记录今日':dateCN(dateStr);
  var d=data.diaries[dateStr]||{text:'',images:[]};
  document.getElementById('editorText').value=d.text||'';
  renderEditorImages(dateStr);
  renderTodayTasks(dateStr);
  // 清空画布
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#fffdf8';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  canvasImages=[];
  undoStack=[];
  // 恢复该日期的画布（如果有保存过drawing，暂不实现复杂逻辑，只保留文字+图片附件）
  document.getElementById('editorSave').onclick=function(){
    if(!data.diaries[dateStr])data.diaries[dateStr]={text:'',images:[]};
    data.diaries[dateStr].text=document.getElementById('editorText').value;
    saveData();
    toast('已保存 ❀');
    goPage('home');
    refreshHome();
  };
}
function renderEditorImages(dateStr){
  var d=data.diaries[dateStr];
  var wrap=document.getElementById('editorImages');
  wrap.innerHTML='';
  if(!d||!d.images)return;
  d.images.forEach(function(src){
    var img=document.createElement('img');
    img.src=src;wrap.appendChild(img);
  });
}
function renderTodayTasks(dateStr){
  var tasks=data.plans.filter(function(p){return p.date===dateStr&&!p.done});
  var box=document.getElementById('todayTasks');
  var list=document.getElementById('todayTaskList');
  if(tasks.length===0){box.classList.add('hidden');return}
  box.classList.remove('hidden');
  list.innerHTML='';
  tasks.forEach(function(t){
    var div=document.createElement('div');
    div.style.cssText='display:flex;align-items:center;gap:10px;background:#fffdf8;padding:10px 14px;border-radius:14px;border:1.5px dashed #f0e6d8;font-size:14px';
    var cb=document.createElement('input');
    cb.type='checkbox';
    cb.onchange=function(){t.done=true;saveData();renderTodayTasks(dateStr)};
    var span=document.createElement('span');
    span.textContent=t.text;span.style.flex='1';
    div.appendChild(cb);div.appendChild(span);
    list.appendChild(div);
  });
}

// ==================== 昨日 ====================
var yesterdayDates=[];var yesterdayIndex=0;
function renderYesterday(){
  var all=Object.keys(data.diaries).sort();
  var today=todayStr();
  var past=all.filter(function(d){return d<today});
  yesterdayDates=past;
  if(past.length===0){
    document.getElementById('yesterdayContent').innerHTML='<div class="yesterday-empty">还没有记录哦～</div>';
    document.getElementById('flipInfo').textContent='0 / 0';
    document.getElementById('flipPrev').disabled=true;
    document.getElementById('flipNext').disabled=true;
    return;
  }
  yesterdayIndex=past.length-1;showYesterday();
}
function showYesterday(){
  var date=yesterdayDates[yesterdayIndex];
  var d=data.diaries[date];
  var html='<div style="font-size:12px;color:#b8a090;margin-bottom:10px;">'+dateCN(date)+'</div>';
  if(d.text)html+=d.text.replace(/\n/g,'<br>');
  if(d.images&&d.images.length){d.images.forEach(function(src){html+='<img src="'+src+'">'})}
  document.getElementById('yesterdayContent').innerHTML=html;
  document.getElementById('flipInfo').textContent=(yesterdayIndex+1)+' / '+yesterdayDates.length;
  document.getElementById('flipPrev').disabled=yesterdayIndex===0;
  document.getElementById('flipNext').disabled=yesterdayIndex===yesterdayDates.length-1;
}
document.getElementById('flipPrev').addEventListener('click',function(){if(yesterdayIndex>0){yesterdayIndex--;showYesterday()}});
document.getElementById('flipNext').addEventListener('click',function(){if(yesterdayIndex<yesterdayDates.length-1){yesterdayIndex++;showYesterday()}});
document.getElementById('lockOverlay').addEventListener('click',function(){toast('昨天已经过去了，请多多关注今天吧 🌱')});

// ==================== 计划 ====================
function renderPlan(){
  var active=data.plans.filter(function(p){return !p.done});
  var done=data.plans.filter(function(p){return p.done});
  var a=document.getElementById('planListActive');
  var d=document.getElementById('planListDone');
  a.innerHTML='';d.innerHTML='';
  if(active.length===0)a.innerHTML='<div style="font-size:13px;color:#d0c0b0;text-align:center;padding:20px;">暂无待完成计划</div>';
  active.forEach(function(p){a.appendChild(makePlanItem(p))});
  if(done.length===0)d.innerHTML='<div style="font-size:13px;color:#d0c0b0;text-align:center;padding:20px;">暂无已完成计划</div>';
  done.forEach(function(p){d.appendChild(makePlanItem(p))});
}
function makePlanItem(p){
  var div=document.createElement('div');
  div.className='plan-item'+(p.done?' done':'');
  var cb=document.createElement('button');
  cb.className='plan-check'+(p.done?' checked':'');
  cb.textContent='✓';
  cb.onclick=function(){p.done=!p.done;saveData();renderPlan()};
  var span=document.createElement('span');
  span.className='plan-text';span.textContent=p.text;
  var tag=document.createElement('span');
  tag.className='plan-date-tag';tag.textContent=p.date?dateCN(p.date):'';
  var del=document.createElement('button');
  del.className='plan-del';del.textContent='×';
  del.onclick=function(){data.plans=data.plans.filter(function(x){return x.id!==p.id});saveData();renderPlan()};
  div.appendChild(cb);div.appendChild(span);div.appendChild(tag);div.appendChild(del);
  return div;
}
document.getElementById('planAdd').addEventListener('click',function(){
  var text=document.getElementById('planInput').value.trim();
  var date=document.getElementById('planDate').value;
  if(!text){toast('请输入计划内容');return}
  if(!date){toast('请选择日期');return}
  data.plans.push({id:Date.now(),text:text,date:date,done:false});
  saveData();
  document.getElementById('planInput').value='';
  renderPlan();
  toast('已添加计划 ✿');
});

// ==================== 我的 ====================
function refreshProfile(){
  var name=data.profile.name||'';
  document.getElementById('nameInput').value=name;
  var avatar=data.profile.avatar;
  var preview=document.getElementById('avatarPreview');
  if(avatar){
    preview.innerHTML='<img src="'+avatar+'"><div class="edit-hint">点击更换</div>';
  }else{
    preview.innerHTML='<span id="avatarEmoji">🌸</span><div class="edit-hint">点击更换</div>';
  }
  var days=Object.keys(data.diaries).length;
  var plansDone=data.plans.filter(function(p){return p.done}).length;
  var words=0;
  Object.keys(data.diaries).forEach(function(k){words+=(data.diaries[k].text||'').length});
  document.getElementById('statDays').textContent=days;
  document.getElementById('statPlans').textContent=plansDone;
  document.getElementById('statWords').textContent=words;
}
document.getElementById('nameInput').addEventListener('input',function(){data.profile.name=this.value.trim();saveData()});
document.getElementById('avatarPreview').addEventListener('click',function(){document.getElementById('avatarFile').click()});
document.getElementById('avatarFile').addEventListener('change',function(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){data.profile.avatar=ev.target.result;saveData();refreshProfile()};
  reader.readAsDataURL(file);
});

// ==================== 导出 ====================
document.getElementById('btnExportToday').addEventListener('click',function(){exportDiary(todayStr())});
document.getElementById('btnExportYesterday').addEventListener('click',function(){
  var all=Object.keys(data.diaries).sort();
  var past=all.filter(function(d){return d<todayStr()});
  if(past.length===0){toast('还没有昨日记录');return}
  exportDiary(past[past.length-1]);
});
function exportDiary(dateStr){
  var d=data.diaries[dateStr];
  if(!d||(!d.text&&(!d.images||d.images.length===0))){toast('这一天还没有记录');return}
  var c=document.createElement('canvas');
  var W=600;c.width=W;c.height=900;
  var cx=c.getContext('2d');
  cx.fillStyle='#fffdf8';cx.fillRect(0,0,W,900);
  for(var y=0;y<900;y+=28){cx.strokeStyle='#f5ece0';cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
  cx.fillStyle='#4a3f35';cx.font='16px sans-serif';
  var lines=[];var text=d.text||'';var words=text.split('');var line='';
  for(var i=0;i<words.length;i++){var test=line+words[i];
    if(cx.measureText(test).width>W-80){lines.push(line);line=words[i]}else{line=test}}
  lines.push(line);
  lines.forEach(function(l,idx){cx.fillText(l,40,60+idx*28)});
  var imgY=60+lines.length*28+20;
  if(d.images&&d.images.length){
    d.images.forEach(function(src,idx){
      var img=new Image();
      img.onload=function(){
        var scale=Math.min(200/img.width,200/img.height);
        var w=img.width*scale,h=img.height*scale;
        cx.drawImage(img,40,imgY+idx*(h+10),w,h);
        if(idx===d.images.length-1){addWatermark(cx,W,900);finishExport(c)}
      };
      img.src=src;
    });
  }else{addWatermark(cx,W,900);finishExport(c)}
}
function addWatermark(cx,W,H){
  var name=data.profile.name||'';
  var avatar=data.profile.avatar;
  cx.globalAlpha=0.5;
  if(avatar){
    var img=new Image();
    img.onload=function(){
      var size=60;
      cx.drawImage(img,W/2-size/2,H/2-size/2,size,size);
      if(name){cx.fillStyle='#4a3f35';cx.font='bold 16px sans-serif';cx.textAlign='center';cx.fillText(name,W/2,H/2+40)}
    };
    img.src=avatar;
  }else if(name){
    cx.fillStyle='#4a3f35';cx.font='bold 20px sans-serif';cx.textAlign='center';cx.fillText(name,W/2,H/2);
  }
  cx.globalAlpha=1;
}
function finishExport(canvas){
  var url=canvas.toDataURL('image/png');
  var a=document.createElement('a');
  a.href=url;a.download='diary_'+Date.now()+'.png';a.click();
  toast('图片已生成，请在下载中查看 ✿');
}

refreshHome();
</script>
